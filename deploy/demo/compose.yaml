# The demo, as one stack.
#
# Images come from GHCR rather than being built here: a build on the deployment
# host is slow, occasionally flaky, and puts a JDK somewhere it does not belong.
# CI builds them; this pulls them.
#
# The database is yours. There is no postgres service here on purpose — this
# stack connects to one, it does not operate one.

services:
  # Vendor plumbing: which provider actually serves a model, whose key it uses,
  # and what to fall back to. PipeMesh sees one OpenAI-compatible endpoint and
  # knows none of it.
  #
  # The line between the two is worth keeping: LiteLLM owns vendors, PipeMesh
  # owns the execution's own budget, quota and schema validation. Two systems
  # counting the same money is how two numbers start disagreeing.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      # Named here, held wherever the deployment keeps its environment. A key
      # never belongs in a committed file — the rule the model registrations
      # already follow.
      GROQ_API_KEY: ${GROQ_API_KEY:?set this in the environment}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set this in the environment}
    volumes:
      - ./litellm.yaml:/app/config.yaml:ro
    restart: unless-stopped

  # Serves callers and drives executions. One process is right for a demo;
  # splitting api from dispatcher is two environment variables when it is not.
  runtime:
    image: ghcr.io/burakbalim/pipemesh-runtime:staging
    depends_on: [litellm]
    environment:
      PIPEMESH_CONFIG: /etc/pipemesh
      PIPEMESH_DB_URL: ${PIPEMESH_DB_URL:?set this in the environment}
      PIPEMESH_DB_USER: ${PIPEMESH_DB_USER:?set this in the environment}
      PIPEMESH_DB_PASSWORD: ${PIPEMESH_DB_PASSWORD:?set this in the environment}
      PIPEMESH_DISPATCH: "on"
      LITELLM_KEY: ${LITELLM_MASTER_KEY}
    volumes:
      # The workflows this runtime serves, from the deployment's checkout.
      # Nothing is baked into the image: which flows exist is the operator's
      # decision, not the image's (§31).
      - ../../examples/vendor-selection:/etc/pipemesh:ro
    restart: unless-stopped

  # Accounts, keys, plans and quota. The product.
  console:
    image: ghcr.io/burakbalim/pipemesh-console:staging
    environment:
      CONSOLE_DB_URL: ${PIPEMESH_DB_URL}
      CONSOLE_DB_USER: ${PIPEMESH_DB_USER}
      CONSOLE_DB_PASSWORD: ${PIPEMESH_DB_PASSWORD}
      CONSOLE_RUNTIME_TARGET: runtime:8080
      CONSOLE_BASE_URL: ${CONSOLE_BASE_URL:?set this in the environment}
      CONSOLE_COOKIE_SECURE: "true"
      # Start with false: verification links go to the log, which is what you
      # want while testing sign-up yourself. Turning it on demands a real mail
      # sender and refuses to start without one — that is the whole point of the
      # flag, and it should be on before anybody outside can reach this.
      CONSOLE_CLOUD: ${CONSOLE_CLOUD:-false}
      CONSOLE_DEFAULT_PLAN: demo
    ports:
      - "8090"
    restart: unless-stopped

  # The demo itself: an application that uses PipeMesh, not part of it. It serves
  # the capabilities the workflow calls, which is why there are two processes to
  # watch rather than one.
  demo:
    image: ghcr.io/burakbalim/pipemesh-demo:staging
    depends_on: [runtime]
    environment:
      PIPEMESH_TARGET: runtime:8080
      PIPEMESH_ORGANIZATION: demo
    volumes:
      # The same files the runtime is serving, not the image's copy of them.
      # The source page claims to show what is running; two copies that could
      # drift would make that claim false the first time they did.
      - ../../examples/vendor-selection:/app/examples/vendor-selection:ro
    ports:
      - "8000"
    restart: unless-stopped
