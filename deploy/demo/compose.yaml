# The demo, as one stack.
#
# Images come from GHCR rather than being built here: a build on the deployment
# host is slow, occasionally flaky, and puts a JDK somewhere it does not belong.
# CI builds them; this pulls them.
#
# The database is yours. There is no postgres service here on purpose — this
# stack connects to one, it does not operate one.
#
# Two of the four services are reachable from outside, and they are reached
# through whatever reverse proxy already holds :443 on the host. That proxy's
# network, and the hostnames, are environment — a compose file that named one
# deployment's proxy would only work at that deployment.

services:
  # Everything this stack reads from disk comes out of an image rather than off
  # the host. Relative bind mounts assume the deployment left a checkout beside
  # the compose file; several platforms copy only the compose file, and Docker
  # then creates an empty directory at each missing source — leaving the runtime
  # pointed at a config directory with no workflows in it, and nothing saying so.
  #
  # It also settles a mismatch that was here before: the runtime and the demo's
  # source page now read the same bytes, because both come from this image.
  config:
    image: ghcr.io/burakbalim/pipemesh-demo:staging
    # A fresh volume belongs to root and the demo image runs as someone else.
    # This container only copies files and exits.
    user: root
    command:
      - sh
      - -c
      - >
        rm -rf /workflows/* &&
        cp -a /app/examples/vendor-selection/. /workflows/ &&
        cp -a /app/deploy/litellm.yaml /litellm/config.yaml
    volumes:
      - workflows:/workflows
      - litellm-config:/litellm
    restart: "no"

  # Vendor plumbing: which provider actually serves a model, whose key it uses,
  # and what to fall back to. PipeMesh sees one OpenAI-compatible endpoint and
  # knows none of it.
  #
  # The line between the two is worth keeping: LiteLLM owns vendors, PipeMesh
  # owns the execution's own budget, quota and schema validation. Two systems
  # counting the same money is how two numbers start disagreeing.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/config/config.yaml", "--port", "4000"]
    depends_on:
      config: { condition: service_completed_successfully }
    environment:
      # Named here, held wherever the deployment keeps its environment. A key
      # never belongs in a committed file — the rule the model registrations
      # already follow.
      GROQ_API_KEY: ${GROQ_API_KEY:?set this in the environment}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set this in the environment}
    volumes:
      - litellm-config:/config:ro
    restart: unless-stopped

  # Serves callers and drives executions. One process is right for a demo;
  # splitting api from dispatcher is two environment variables when it is not.
  runtime:
    image: ghcr.io/burakbalim/pipemesh-runtime:staging
    depends_on:
      config: { condition: service_completed_successfully }
      litellm: { condition: service_started }
    environment:
      PIPEMESH_CONFIG: /etc/pipemesh
      PIPEMESH_DB_URL: ${PIPEMESH_DB_URL:?set this in the environment}
      PIPEMESH_DB_USER: ${PIPEMESH_DB_USER:?set this in the environment}
      PIPEMESH_DB_PASSWORD: ${PIPEMESH_DB_PASSWORD:?set this in the environment}
      PIPEMESH_DISPATCH: "on"
      LITELLM_KEY: ${LITELLM_MASTER_KEY}
    volumes:
      # The workflows this runtime serves. Still not baked into the runtime
      # image — which flows exist stays the operator's decision (§31); here the
      # operator is the demo, and it hands them over in a volume.
      - workflows:/etc/pipemesh:ro
    restart: unless-stopped

  # Accounts, keys, plans and quota. The product.
  console:
    image: ghcr.io/burakbalim/pipemesh-console:staging
    networks: [default, proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${PROXY_NETWORK}
      traefik.http.routers.pipemesh-console.rule: Host(`${CONSOLE_HOST:?set this in the environment}`)
      traefik.http.routers.pipemesh-console.entrypoints: http
      traefik.http.routers.pipemesh-console.middlewares: pipemesh-to-https
      traefik.http.routers.pipemesh-console-tls.rule: Host(`${CONSOLE_HOST}`)
      traefik.http.routers.pipemesh-console-tls.entrypoints: https
      traefik.http.routers.pipemesh-console-tls.tls: "true"
      traefik.http.routers.pipemesh-console-tls.tls.certresolver: ${CERT_RESOLVER:-letsencrypt}
      traefik.http.services.pipemesh-console.loadbalancer.server.port: "8090"
      traefik.http.middlewares.pipemesh-to-https.redirectscheme.scheme: https
    environment:
      CONSOLE_DB_URL: ${PIPEMESH_DB_URL}
      CONSOLE_DB_USER: ${PIPEMESH_DB_USER}
      CONSOLE_DB_PASSWORD: ${PIPEMESH_DB_PASSWORD}
      CONSOLE_RUNTIME_TARGET: runtime:8080
      CONSOLE_BASE_URL: ${CONSOLE_BASE_URL:?set this in the environment}
      CONSOLE_COOKIE_SECURE: "true"
      # Start with false: verification links go to the log, which is what you
      # want while testing sign-up yourself. Turning it on demands a real mail
      # sender and refuses to start without one — that is the whole point of the
      # flag, and it should be on before anybody outside can reach this.
      CONSOLE_CLOUD: ${CONSOLE_CLOUD:-false}
      CONSOLE_DEFAULT_PLAN: demo
    restart: unless-stopped

  # The demo itself: an application that uses PipeMesh, not part of it. It serves
  # the capabilities the workflow calls, which is why there are two processes to
  # watch rather than one.
  demo:
    image: ghcr.io/burakbalim/pipemesh-demo:staging
    depends_on: [runtime]
    networks: [default, proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${PROXY_NETWORK}
      traefik.http.routers.pipemesh-demo.rule: Host(`${DEMO_HOST:?set this in the environment}`)
      traefik.http.routers.pipemesh-demo.entrypoints: http
      traefik.http.routers.pipemesh-demo.middlewares: pipemesh-to-https
      traefik.http.routers.pipemesh-demo-tls.rule: Host(`${DEMO_HOST}`)
      traefik.http.routers.pipemesh-demo-tls.entrypoints: https
      traefik.http.routers.pipemesh-demo-tls.tls: "true"
      traefik.http.routers.pipemesh-demo-tls.tls.certresolver: ${CERT_RESOLVER:-letsencrypt}
      traefik.http.services.pipemesh-demo.loadbalancer.server.port: "8000"
    environment:
      PIPEMESH_TARGET: runtime:8080
      PIPEMESH_ORGANIZATION: demo
    # No mount: the source page reads the copy inside this image, which is the
    # one the config service handed to the runtime.
    restart: unless-stopped

volumes:
  workflows:
  litellm-config:

networks:
  # The runtime, the model proxy and the two services talk to each other here,
  # and nothing on it is reachable from outside.
  default:

  # The reverse proxy's own network, created by whoever runs it. Named by
  # environment rather than written down: this stack should come up in front of
  # any Traefik, not one particular installation's.
  proxy:
    external: true
    name: ${PROXY_NETWORK:?set this in the environment}
