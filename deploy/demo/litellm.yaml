# What actually answers a model call.
#
# PipeMesh names an alias — `fast`, `reasoning` — and never learns what is
# behind it. Changing a model here changes no workflow and no code, which is the
# same property capabilities have about their transport (§9.8).

model_list:
  # Both declare `structured_outputs`, which is what matters here: the runtime
  # sends `response_format: json_schema` and validates the answer at the step
  # boundary. A model with only `json_mode` returns *some* JSON, not the shape
  # that was asked for — the difference is three retries and a failed step.
  - model_name: fast
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY

  - model_name: reasoning
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY

litellm_settings:
  # A free endpoint has rate limits, and a demo that dies on one is a demo that
  # teaches the wrong lesson. Falling back keeps the failure from reaching the
  # workflow, where it would look like the runtime's fault.
  fallbacks:
    - reasoning: ["fast"]

  # A model that does not support `response_format` gets the parameter dropped
  # rather than a 400 back. The trade is deliberate: dropping loses the
  # structured-output request, so the prompts also ask for JSON in words and
  # PipeMesh validates the answer either way. Refusing instead would make one
  # unsupported model take the whole demo down.
  drop_params: true
