# What actually answers a model call.
#
# PipeMesh names an alias — `fast`, `reasoning` — and never learns what is
# behind it. Changing a model here changes no workflow and no code, which is the
# same property capabilities have about their transport (§9.8).

model_list:
  - model_name: fast
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: os.environ/GROQ_API_KEY

  - model_name: reasoning
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

litellm_settings:
  # A free endpoint has rate limits, and a demo that dies on one is a demo that
  # teaches the wrong lesson. Falling back keeps the failure from reaching the
  # workflow, where it would look like the runtime's fault.
  fallbacks:
    - reasoning: ["fast"]
  drop_params: true
