# Every value here is a placeholder. Replace them, and do not commit the result.
#
# Secrets live here rather than in the configuration directory because that
# directory is shared, reviewed and often in git — the runtime reads a model's
# key from the environment by name, never from a file (DESIGN.md §31).
apiVersion: v1
kind: Secret
metadata:
  name: pipemesh
  namespace: pipemesh
type: Opaque
stringData:
  PIPEMESH_DB_URL: jdbc:postgresql://your-database:5432/pipemesh
  PIPEMESH_DB_USER: pipemesh
  PIPEMESH_DB_PASSWORD: replace-me
  OPENAI_API_KEY: replace-me
  CONSOLE_MAIL_HOST: smtp.example.com
  CONSOLE_MAIL_FROM: no-reply@example.com
  CONSOLE_MAIL_USERNAME: replace-me
  CONSOLE_MAIL_PASSWORD: replace-me
