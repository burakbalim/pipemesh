# Drives executions. Takes no calls.
#
# The same image as the api deployment. It still binds a port because the server
# is what holds the process open; nothing routes to it.
#
# Scale this with how much work is waiting, not with how many requests arrive —
# a burst of long workflows needs more drivers, not more API replicas (§28.1).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipemesh-dispatcher
  namespace: pipemesh
spec:
  replicas: 2
  selector:
    matchLabels: {app: pipemesh-dispatcher}
  template:
    metadata:
      labels: {app: pipemesh-dispatcher}
    spec:
      containers:
        - name: runtime
          image: pipemesh/runtime:0.1.0
          envFrom:
            - secretRef:
                name: pipemesh
          env:
            - name: PIPEMESH_CONFIG
              value: /etc/pipemesh
            - name: PIPEMESH_DISPATCH
              value: "on"
          volumeMounts:
            - name: workflows
              mountPath: /etc/pipemesh
              readOnly: true
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: workflows
          configMap:
            name: pipemesh-workflows
