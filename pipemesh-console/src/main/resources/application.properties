spring.application.name=pipemesh-console

# The console shares a database with the runtime: usage is read from the
# executions the runtime already wrote, rather than counted twice (§39.1).
spring.datasource.url=${CONSOLE_DB_URL:jdbc:postgresql://localhost:5432/pipemesh}
spring.datasource.username=${CONSOLE_DB_USER:pipemesh}
spring.datasource.password=${CONSOLE_DB_PASSWORD:pipemesh}

# Off only for local development over plain HTTP, where a secure cookie would
# never be sent and nothing would work.
console.cookie.secure=${CONSOLE_COOKIE_SECURE:true}

server.port=${CONSOLE_PORT:8090}

# Where the runtime is. The console is an ordinary client of it — no private
# door, no standing credential (§26.1).
console.runtime.target=${CONSOLE_RUNTIME_TARGET:localhost:8080}

# Which workflow the demo screen runs. A name, so the example can change without
# a deploy of the console.
console.demo.workflow=${CONSOLE_DEMO_WORKFLOW:demo}

# Whether this deployment is shared. It turns on the checks that only matter
# when other people can reach it — see CloudReadiness.
console.cloud=${CONSOLE_CLOUD:false}

# Where this console is reachable, for the links it emails.
console.baseUrl=${CONSOLE_BASE_URL:http://localhost:5173}

# Mail is deliberately not declared here with empty defaults. An empty property
# still counts as present to @ConditionalOnProperty, which is how the SMTP
# sender switched itself on with no host to send through. Set CONSOLE_MAIL_HOST
# and friends in the environment; Spring maps them to console.mail.* on its own.
#
# Without a host the console logs links instead — fine on one machine, refused
# when console.cloud is true.
console.mail.port=${CONSOLE_MAIL_PORT:587}

# Which plan a new account lands on. `demo` where accounts are handed out to
# strangers; `unlimited` where somebody bought a licence and stopping them at
# fifty executions would be absurd. Both are rows in console_plan.
console.defaultPlan=${CONSOLE_DEFAULT_PLAN:demo}
