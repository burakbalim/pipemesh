spring.application.name=pipemesh-console

# The console shares a database with the runtime: usage is read from the
# executions the runtime already wrote, rather than counted twice (§39.1).
spring.datasource.url=${CONSOLE_DB_URL:jdbc:postgresql://localhost:5432/pipemesh}
spring.datasource.username=${CONSOLE_DB_USER:pipemesh}
spring.datasource.password=${CONSOLE_DB_PASSWORD:pipemesh}

# Off only for local development over plain HTTP, where a secure cookie would
# never be sent and nothing would work.
console.cookie.secure=${CONSOLE_COOKIE_SECURE:true}

server.port=${CONSOLE_PORT:8090}
